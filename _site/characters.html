<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RETROGRADE - CHARACTERS</title>
    <link rel="stylesheet" type="text/css" href="./style/selectcss.css">
    <link rel="stylesheet" href="./style/style.css">
    <link rel="stylesheet" href="./style/root.css">
</head>
    <style>

        a {color: var(--text-color)
    ; text-decoration: none;}

    a:hover {
        color: var(--grey)
    }

    </style>
<body class="altchecker-page">
    <div id="header-placeholder"></div>
    <script src="header.js"></script>

    <div class="character-menu">
        <h1 class="title">Select Character</h1>
        <div class="filters">


            <div class="tag-filters" id="tagFilters"></div>
        </div>

        <div class="character-row" id="characterRow"></div>
    </div>

<div class="character-display" id="characterDisplay">
        <img id="characterLogo" class="character-logo" src="" alt="Character Logo">
        <div id="characterNameTitle" class="character-name-title"></div>

        <div class="character-info" id="characterInfo">
            <h2 id="characterName"></h2>
            <p id="characterDesc"></p>
        </div>
    </div>
    <script src="characters.js"></script>
    <script src="characterscript.js"></script>

    <script>
    window.addEventListener('load', function() {
        const audio = new Audio('https://file.garden/ZeOUdxtzykkkU6hs/Music/');
        audio.loop = true;
        audio.volume = 0.5;

        audio.play().catch(e => {
            const playOnInteraction = () => {
                audio.play();
                window.removeEventListener('click', playOnInteraction);
                window.removeEventListener('keydown', playOnInteraction);
                window.removeEventListener('touchstart', playOnInteraction);
            };

            window.addEventListener('click', playOnInteraction);
            window.addEventListener('keydown', playOnInteraction);
            window.addEventListener('touchstart', playOnInteraction);
        });
    });
    </script>
</body>
</html>
