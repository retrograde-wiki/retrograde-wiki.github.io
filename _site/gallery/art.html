<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  
  <link rel="stylesheet" href="/style/style.css">
  <link rel="stylesheet" href="/style/root.css">
  <script src="/style/hover.js"></script>
  <title>RETROGRADE - ART</title>
</head>
<body>
  <div id="header-placeholder"></div>
  <script src="/header.js"></script>

  <div class="art-page">
    <div class="lore-header">
      <h1 class="lore-title">Art</h1>
      <p class="intro-subtitle">Full illustrations</p>
    </div>

    

    
    <div class="art-grid masonry">
      
      <figure class="art-item">
        <img src="/im/art/stubri.png" data-full="/im/art/stubri.png" alt="Stu and Bri hanging in Sigma" loading="lazy">
        
        <figcaption class="art-caption">Stu and Bri hanging in Sigma</figcaption>
      </figure>
      
      <figure class="art-item">
        <img src="/im/art/retroroom.png" data-full="/im/art/retroroom.png" alt="Apartment Design Exploration" loading="lazy">
        
        <figcaption class="art-caption">Apartment Design Exploration</figcaption>
      </figure>
      
      <figure class="art-item">
        <img src="/im/art/rho.png" data-full="/im/art/rho.png" alt="Zone 17 Rho" loading="lazy">
        
        <figcaption class="art-caption">Zone 17 Rho</figcaption>
      </figure>
      
      <figure class="art-item">
        <img src="/im/art/concept.png" data-full="/im/art/concept.png" alt="Art direction concept" loading="lazy">
        
        <figcaption class="art-caption">Art direction concept</figcaption>
      </figure>
      
    </div>
    
  </div>
</body>
</html>
