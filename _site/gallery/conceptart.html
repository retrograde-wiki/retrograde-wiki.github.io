<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  
  <link rel="stylesheet" href="/style/style.css">
  <link rel="stylesheet" href="/style/root.css">
  <script src="/style/hover.js"></script>
  <title>RETROGRADE - CONCEPT ART</title>
</head>
<body>
  <div id="header-placeholder"></div>
  <script src="/header.js"></script>

  <div class="art-page">
    <div class="lore-header">
      <h1 class="lore-title">Concept Art</h1>
      <p class="intro-subtitle">Sketches, doodles and extras</p>
    </div>

    

    
    <div class="art-grid square">
      
      <figure class="art-item">
        <img src="/im/conceptart/stubri.png" data-full="/im/conceptart/stubri.png" alt="Initial Stu and Bridgette concept" loading="lazy">
        
        <figcaption class="art-caption">Initial Stu and Bridgette concept</figcaption>
      </figure>
      
      <figure class="art-item">
        <img src="/im/conceptart/medinaconcept.png" data-full="/im/conceptart/medinaconcept.png" alt="Medina Concept" loading="lazy">
        
        <figcaption class="art-caption">Medina Concept</figcaption>
      </figure>
      
    </div>
    
  </div>
</body>
</html>
