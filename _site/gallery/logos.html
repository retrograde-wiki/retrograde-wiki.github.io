<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  
  <link rel="stylesheet" href="/style/style.css">
  <link rel="stylesheet" href="/style/root.css">
  <script src="/style/hover.js"></script>
  <title>RETROGRADE - GRAPHIC DESIGN</title>
</head>
<body>
  <div id="header-placeholder"></div>
  <script src="/header.js"></script>

  <div class="art-page">
    <div class="lore-header">
      <h1 class="lore-title">Graphic Design</h1>
      <p class="intro-subtitle">Logos and Design</p>
    </div>

    

    
    <div class="art-grid contain">
      
      <figure class="art-item">
        <img src="/im/logos/website/blue.svg" data-full="/im/logos/website/blue.svg" alt="Retrograde / Blue" loading="lazy">
        
        <figcaption class="art-caption">Retrograde / Blue</figcaption>
      </figure>
      
      <figure class="art-item">
        <img src="/im/logos/website/red.svg" data-full="/im/logos/website/red.svg" alt="Retrograde / Red" loading="lazy">
        
        <figcaption class="art-caption">Retrograde / Red</figcaption>
      </figure>
      
      <figure class="art-item">
        <img src="/im/logos/website/green.svg" data-full="/im/logos/website/green.svg" alt="Retrograde / Green" loading="lazy">
        
        <figcaption class="art-caption">Retrograde / Green</figcaption>
      </figure>
      
      <figure class="art-item">
        <img src="/im/logos/design/SolarSystem.png" data-full="/im/logos/design/SolarSystem.png" alt="The Keplar System" loading="lazy">
        
        <figcaption class="art-caption">The Keplar System</figcaption>
      </figure>
      
      <figure class="art-item">
        <img src="/im/logos/design/sandwich.png" data-full="/im/logos/design/sandwich.png" alt="Toasteez Advertisement" loading="lazy">
        
        <figcaption class="art-caption">Toasteez Advertisement</figcaption>
      </figure>
      
    </div>
    
  </div>
</body>
</html>
