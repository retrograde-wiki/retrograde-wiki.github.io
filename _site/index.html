    <style>


          :root {
     --hl-color: var(--hl-yellow);
    --bg: var(--bg-grey);

    }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            position: relative;
                background: url('/im/backgrounds/background.png') !important;
                background-size: cover !important;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #000;
            min-width: 160px;
            z-index: 1;
            border: 1px solid #333;
            border-top: none;
            border-radius: 0 0 4px 4px;
        }

        .dropdown-content a {
            color: var(--text);
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-size: 14px;
        }

        .dropdown-content a:hover {
            background-color: #222;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .dropdown:hover > a {
            position: relative;
        }

        .dropdown:hover > a::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -2px;
            height: 1px;
            background-color: #fff;
        }

        .title {
            position: absolute;
            top: 80px;
            left: 40px;
            font-size: 140px;
            font-weight: 900;
            line-height: 0.9;
            width: 250px;
            z-index: 10;
    font-family: 'Tomorrow';
    color: var(--white);
    -webkit-text-stroke: 6px var(--blue);

        }

        .description {
            position: absolute;
            bottom: 40px;
            left: 40px;
            text-align: left;
            font-size: 16px;
            line-height: 1.4;
            max-width: 400px;
            color: var(--white);
        }

    </style>
</head>
