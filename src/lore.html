---
layout: layouts/base.njk
title: "Lore"
extraCss: /css/lore.css
---
<main class="lore-home">
  <span class="cg-eyebrow">Archive</span>
  <h2 class="cg-title">Lore</h2>

  <div class="lore-card-grid">
    {% for entry in collections.lore %}
      {% if not entry.data.hideFromIndex %}
      <a href="{{ entry.url }}" class="lore-card">
        <div class="lore-card-icon"><i class="fa-solid {{ entry.data.icon or 'fa-file-lines' }}"></i></div>
        <span class="lore-card-title">{{ entry.data.title }}</span>
      </a>
      {% endif %}
    {% endfor %}
  </div>
</main>
